name = "vetai-staging"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
APP_TIMEZONE = "Europe/Istanbul"
WHATSAPP_GRAPH_API_VERSION = "v25.0"

[[queues.producers]]
queue = "vetai-intake-staging"
binding = "INTAKE_QUEUE"

[[queues.consumers]]
queue = "vetai-intake-staging"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
retry_delay = 120
dead_letter_queue = "vetai-intake-dlq-staging"

[[queues.consumers]]
queue = "vetai-intake-dlq-staging"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
retry_delay = 300
dead_letter_queue = "vetai-intake-terminal-dlq-staging"

[triggers]
crons = ["* * * * *"]
