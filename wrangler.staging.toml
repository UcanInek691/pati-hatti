name = "vetai-staging"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
APP_TIMEZONE = "Europe/Istanbul"
WHATSAPP_GRAPH_API_VERSION = "v25.0"

# Task 053: operational alerting, NOT activated (see docs/operational-alerting.md).
# RESEND_API_KEY and CLOUDFLARE_ALERTS_MONITORING_TOKEN are secrets set via
# `wrangler secret put`, never written here.
OPERATIONAL_ALERTS_ENABLED = "false"
RESEND_FROM_ADDRESS = "alerts@vetai-alerts.invalid"
STAFF_LOGIN_URL = "https://portal.vetai-portal.invalid/staff"
CLOUDFLARE_ACCOUNT_ID = "[cloudflare-account-id]"
DEPLOYMENT_NAME = "staging"
INTAKE_QUEUE_NAME = "vetai-intake-staging"
INTAKE_DLQ_NAME = "vetai-intake-dlq-staging"
INTAKE_TERMINAL_DLQ_NAME = "vetai-intake-terminal-dlq-staging"

[[queues.producers]]
queue = "vetai-intake-staging"
binding = "INTAKE_QUEUE"

# Task 036: max_batch_timeout lowered 5 -> 1. With max_batch_size = 1 a single
# message already fills a batch, so this only bounds the empty-batch wait, but
# every second it can still cost is dead air in front of an owner.
[[queues.consumers]]
queue = "vetai-intake-staging"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
retry_delay = 120
dead_letter_queue = "vetai-intake-dlq-staging"

[[queues.consumers]]
queue = "vetai-intake-dlq-staging"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3
retry_delay = 300
dead_letter_queue = "vetai-intake-terminal-dlq-staging"

[triggers]
crons = ["* * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[observability.logs]
invocation_logs = true
head_sampling_rate = 1
